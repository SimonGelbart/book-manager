name: Validation

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.114

      - name: Restore application tests from the lock file
        run: dotnet restore tests/TomeRaider.Application.Tests/TomeRaider.Application.Tests.csproj --locked-mode

      - name: Restore architecture tests from the lock file
        run: dotnet restore tests/TomeRaider.Architecture.Tests/TomeRaider.Architecture.Tests.csproj --locked-mode

      - name: Build desktop host
        run: dotnet build src/TomeRaider.Desktop/TomeRaider.Desktop.csproj --no-restore

      - name: Run application tests
        run: dotnet test --project tests/TomeRaider.Application.Tests/TomeRaider.Application.Tests.csproj --no-restore

      - name: Run architecture tests
        run: dotnet test --project tests/TomeRaider.Architecture.Tests/TomeRaider.Architecture.Tests.csproj --no-restore

  android-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the pinned Android workload
        run: dotnet workload install android --version 10.0.402

      - name: Re-evaluate the Android package lock
        run: dotnet restore src/TomeRaider.Android/TomeRaider.Android.csproj --force-evaluate

      - name: Verify the Android package lock is committed
        run: |
          if ! git diff --quiet -- src/TomeRaider.Android/packages.lock.json; then
            echo '::error file=src/TomeRaider.Android/packages.lock.json::Android package lock is stale. Run dotnet restore src/TomeRaider.Android/TomeRaider.Android.csproj --force-evaluate and commit the generated lock file.'
            git diff -- src/TomeRaider.Android/packages.lock.json
            exit 1
          fi
